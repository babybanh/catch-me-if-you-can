<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Catch Me If You Can!</title>
    <link rel="preload" as="image" href="/assets/images/catch-me/backgrounds/full-frame/sunny-garden-field.png" fetchpriority="high" />
    <style>
      :root {
        background: #efe0ac;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        display: grid;
        place-items: center;
        background: #efe0ac;
      }

      body.is-loading #game-shell {
        visibility: hidden;
      }

      html.loading-art-ready body.is-loading #game-shell {
        visibility: visible;
      }

      #game-shell {
        position: relative;
        width: min(100vw, calc(100vh * 0.857142857));
        aspect-ratio: 720 / 840;
        overflow: hidden;
        background-color: #efe0ac;
        background-image: url("/assets/images/catch-me/backgrounds/full-frame/sunny-garden-field.png");
        background-position: center;
        background-size: 100% 100%;
      }

      #loading-screen {
        position: absolute;
        inset: 0;
        z-index: 300;
        background: rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(6px) saturate(1.04);
        -webkit-backdrop-filter: blur(6px) saturate(1.04);
        overflow: hidden;
      }

      body.is-loading #game-root,
      body.is-loading #ui-root {
        visibility: hidden;
      }

      .loading-panel {
        position: absolute;
        left: calc((360 / 720) * 100%);
        top: calc((610 / 840) * 100%);
        width: calc((500 / 720) * 100%);
        z-index: 1;
        transform: translate(-50%, -50%);
        padding: 9px 15px;
        border-radius: 18px;
        border: 3px solid rgba(255, 231, 107, 0.95);
        background: rgba(255, 255, 255, 0.86);
        color: #493127;
        text-align: center;
        font: 600 15px "Avenir Next", "Trebuchet MS", Arial, sans-serif;
        box-shadow: 0 8px 22px rgba(103, 65, 75, 0.16);
      }
    </style>
    <script>
      (() => {
        const image = new Image();
        const ready = () => document.documentElement.classList.add("loading-art-ready");
        image.onload = ready;
        image.onerror = ready;
        image.src = "/assets/images/catch-me/backgrounds/full-frame/sunny-garden-field.png";
      })();
    </script>
  </head>
  <body class="is-loading">
    <div id="game-shell">
      <div id="loading-screen">
        <div class="loading-panel">Loading...</div>
      </div>
      <div id="game-root"></div>
      <div id="ui-root" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
