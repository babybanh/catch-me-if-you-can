<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Catch Me If You Can!</title>
    <link rel="preload" as="image" href="/assets/images/catch-me/backgrounds/full-frame/sunny-garden-field.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/assets/images/catch-me/characters/bunbun.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/assets/images/catch-me/characters/banana.png" fetchpriority="high" />
    <style>
      :root {
        background: #efe0ac;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100svh;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
        display: grid;
        place-items: center;
        background: #efe0ac;
      }

      body.is-loading #game-shell {
        visibility: hidden;
      }

      html.loading-art-ready body.is-loading #game-shell {
        visibility: visible;
      }

      #game-shell {
        position: relative;
        width: min(100dvw, calc(100dvh * 0.857142857));
        max-width: 100vw;
        aspect-ratio: 720 / 840;
        overflow: hidden;
        background-color: #efe0ac;
        background-image: url("/assets/images/catch-me/backgrounds/full-frame/sunny-garden-field.png");
        background-position: center;
        background-size: 100% 100%;
        background-repeat: no-repeat;
      }

      #loading-screen {
        position: absolute;
        inset: 0;
        z-index: 300;
        overflow: hidden;
      }

      #loading-screen::before {
        content: "";
        position: absolute;
        inset: 0;
        background-color: #efe0ac;
        background-image: url("/assets/images/catch-me/backgrounds/full-frame/sunny-garden-field.png");
        background-position: center;
        background-size: 100% 100%;
        background-repeat: no-repeat;
        filter: blur(6px) saturate(1.04);
        transform: scale(1.015);
      }

      body.is-loading #game-root,
      body.is-loading #ui-root {
        visibility: hidden;
      }

    </style>
    <script>
      (() => {
        const image = new Image();
        const ready = () => document.documentElement.classList.add("loading-art-ready");
        image.onload = ready;
        image.onerror = ready;
        image.src = "/assets/images/catch-me/backgrounds/full-frame/sunny-garden-field.png";
      })();
    </script>
  </head>
  <body class="is-loading">
    <div id="game-shell">
      <div id="loading-screen" aria-hidden="true"></div>
      <div id="game-root"></div>
      <div id="ui-root" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
